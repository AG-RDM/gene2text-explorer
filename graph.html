    const variantSelect = document.getElementById('variantSelect');
    const thresholdRange = document.getElementById('thresholdRange');
    const thresholdValue = document.getElementById('thresholdValue');
    const svg = document.getElementById('graphSvg');
    const details = document.getElementById('details');

    const variants = Object.keys(graphData.variants);
    variants.forEach((variant) => {
      const option = document.createElement('option');
      option.value = variant;
      option.textContent = variant;
      variantSelect.appendChild(option);
    });

    function renderGraph() {
      const variant = variantSelect.value;
      const threshold = parseFloat(thresholdRange.value);
      thresholdValue.textContent = threshold.toFixed(2);
      const variantData = graphData.variants[variant];
      svg.innerHTML = '';
      details.textContent = 'Select an edge to see details.';

      const width = svg.clientWidth || 1000;
      const height = svg.clientHeight || 700;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(width, height) * 0.35;

      const nodes = variantData.nodes;
      const nodePositions = new Map();
      nodes.forEach((node, index) => {
        const angle = (2 * Math.PI * index) / Math.max(nodes.length, 1);
        nodePositions.set(node.id, {
          x: centerX + radius * Math.cos(angle),
          y: centerY + radius * Math.sin(angle),
        });
      });

      variantData.edges
        .filter((edge) => edge.weight >= threshold)
        .forEach((edge) => {
          const source = nodePositions.get(edge.source);
          const target = nodePositions.get(edge.target);
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', source.x);
          line.setAttribute('y1', source.y);
          line.setAttribute('x2', target.x);
          line.setAttribute('y2', target.y);
          line.setAttribute('stroke', '#4b6cb7');
          line.setAttribute('stroke-width', 1 + edge.weight * 6);
          line.setAttribute('stroke-opacity', Math.max(0.15, edge.weight));
          line.style.cursor = 'pointer';
          const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
          title.textContent = `${edge.source} ↔ ${edge.target} | similarity=${edge.weight.toFixed(3)}`;
          line.appendChild(title);
          line.addEventListener('click', () => {
            details.textContent = `Variant: ${variant}
${edge.source} ↔ ${edge.target}
Weight: ${edge.weight.toFixed(3)}
Rationale: ${edge.rationale}`;
          });
          svg.appendChild(line);
        });

      nodes.forEach((node) => {
        const pos = nodePositions.get(node.id);
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', pos.y);
        circle.setAttribute('r', 8);
        circle.setAttribute('fill', '#1f77b4');
        svg.appendChild(circle);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', pos.x + 10);
        label.setAttribute('y', pos.y + 4);
        label.setAttribute('class', 'node-label');
        label.textContent = node.id;
        svg.appendChild(label);
      });
    }

    variantSelect.addEventListener('change', renderGraph);
    thresholdRange.addEventListener('input', renderGraph);
    if (variants.length > 0) {
      variantSelect.value = variants[0];
      renderGraph();
    }
